# Parking demo stack — PostgreSQL + NestJS API only (no Redis/Nginx).
#
# Usage:
#   cp .env.example .env && cp backend/.env.example backend/.env
#   docker compose up --build
#
# Development (watch mode + published ports):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

name: bkr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bkr}
      POSTGRES_DB: ${POSTGRES_DB:-bkr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bkr

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bkr}:${POSTGRES_PASSWORD:-bkr}@postgres:5432/${POSTGRES_DB:-bkr}?schema=public
      NODE_ENV: production
    ports:
      - "${BACKEND_PUBLISH_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy --schema prisma/schema.prisma && npx prisma generate --schema prisma/schema.prisma && node dist/main.js",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s
    networks:
      - bkr

networks:
  bkr:
    driver: bridge

volumes:
  postgres_data:
