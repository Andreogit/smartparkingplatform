# Development overrides — compose with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# - Published Postgres + Nest ports for local tooling
# - Nest `start:dev` with bind mount + preserved node_modules volume

services:
  postgres:
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy --schema prisma/schema.prisma && npx prisma generate --schema prisma/schema.prisma && npm run start:dev",
      ]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-bkr}:${POSTGRES_PASSWORD:-bkr}@postgres:5432/${POSTGRES_DB:-bkr}?schema=public
    ports:
      - "${BACKEND_PUBLISH_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  backend_node_modules:
